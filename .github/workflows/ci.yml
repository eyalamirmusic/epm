name: CI

# Pushes to main and pull requests (feature branches run it through a PR, or
# by hand with workflow_dispatch): unit tests and the HelloEacp smoke test on
# all five targets, plus the packages as workflow artifacts (so a broken
# install shows up before it reaches a release branch). Tags are built by
# release.yml.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    uses: ./.github/workflows/build.yml
    with:
      smoke: true
      package: true
