name: Build

# Reusable: one job per target, called by ci.yml (tests + HelloEacp smoke) and
# release.yml (tests + packaging). The matrix lives only here.
on:
  workflow_call:
    inputs:
      smoke:
        description: >-
          Build and run Examples/HelloEacp and HelloGraph with the just-built
          epm (on macOS also HelloGraph under Xcode and NestedGraph for the
          iOS simulator)
        type: boolean
        default: false
      package:
        description: Install, archive and upload epm-<version>-<platform>
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    continue-on-error: ${{ matrix.allow-failure == true }}

    strategy:
      fail-fast: false
      matrix:
        # `platform` is the release asset suffix (epm-<version>-<platform>);
        # the PATH smoke test downloads v0.1.1's asset by it, so keep the
        # names stable. `cmake-flags` apply to epm and to the HelloEacp smoke
        # build, `epm-flags` to epm only. Linux links with lld: eacp's
        # set_default_target_setting turns on LTO for Release, and GNU ld
        # cannot read clang's bitcode archives without the LLVMgold plugin.
        # `source-smoke` runs the smoke tests in which get_epm.cmake builds a
        # release tag from source (Debug and Release, a few minutes), on one
        # job only.
        include:
          - platform: macos-universal
            os: macos-15
            epm-flags: '-DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"'
            source-smoke: true
          - platform: windows-x64
            os: windows-latest
            msvc-arch: x64
            cmake-flags: -DCMAKE_C_COMPILER=clang-cl -DCMAKE_CXX_COMPILER=clang-cl
          - platform: windows-arm64
            os: windows-11-arm
            msvc-arch: arm64
            cmake-flags: -DCMAKE_C_COMPILER=clang-cl -DCMAKE_CXX_COMPILER=clang-cl
          - platform: linux-x64
            os: ubuntu-24.04
            cmake-flags: >-
              -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++
              -DCMAKE_LINKER_TYPE=LLD
          - platform: linux-arm64
            os: ubuntu-24.04-arm
            cmake-flags: >-
              -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++
              -DCMAKE_LINKER_TYPE=LLD

    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v7

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld ninja-build libcurl4-openssl-dev

      - name: Set up the MSVC environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.msvc-arch }}

      # Forward slashes on Windows too, so the paths can go straight into CMake.
      - name: Set up paths
        run: |
          root="$(pwd -W 2>/dev/null || pwd)"
          suffix=""
          if [ "$RUNNER_OS" = "Windows" ]; then suffix=".exe"; fi
          {
            echo "ROOT=$root"
            echo "EXE_SUFFIX=$suffix"
            echo "CPM_SOURCE_CACHE=$root/.cpm-cache"
          } >> "$GITHUB_ENV"

      - name: Show the toolchain
        run: |
          cmake --version
          echo "ninja $(ninja --version)"
          if [ "$RUNNER_OS" = "Windows" ]; then
            where clang-cl && clang-cl --version
          else
            clang++ --version
          fi

      # eacp is fetched at GIT_TAG main, which CPM never refreshes inside an
      # existing source cache, so eacp's current commit is part of the key and a
      # new eacp commit starts a fresh cache rather than restoring a stale one.
      - name: Resolve eacp main
        id: eacp
        run: |
          echo "sha=$(git ls-remote https://github.com/eyalamirmusic/eacp refs/heads/main | cut -f1)" >> "$GITHUB_OUTPUT"

      - name: Cache CPM sources
        uses: actions/cache@v6
        with:
          path: .cpm-cache
          key: cpm-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('CMake/Find*.cmake') }}-eacp-${{ steps.eacp.outputs.sha }}

      - name: Configure
        run: >
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          ${{ matrix.cmake-flags }} ${{ matrix.epm-flags }}

      - name: Build
        run: cmake --build build --parallel

      - name: Check the binary
        run: |
          "build/Apps/epm/epm$EXE_SUFFIX" --version
          if [ "$RUNNER_OS" = "macOS" ]; then
            archs="$(lipo -archs build/Apps/epm/epm)"
            echo "architectures: $archs"
            [[ "$archs" == *arm64* && "$archs" == *x86_64* ]]
          fi

      - name: Test
        run: ctest --test-dir build --output-on-failure

      # (a) The full consumer path with this epm: get_epm.cmake takes
      # EPM_EXECUTABLE and, finding no module installed beside it, the
      # repository's CMake/epm.cmake. MODE auto, so eacp is fetched and built
      # (Release only: EPM_CONFIGS auto) into a cache inside the workspace.
      # In-tree on purpose: the bare build-tree epm needs the checkout's module,
      # and EPM_EXECUTABLE keeps get_epm.cmake from building the checkout.
      - name: HelloEacp smoke test
        if: inputs.smoke
        run: |
          cmake -S Examples/HelloEacp -B build-hello -G Ninja -DCMAKE_BUILD_TYPE=Release \
            "-DEPM_EXECUTABLE=$ROOT/build/Apps/epm/epm$EXE_SUFFIX" \
            "-DEPM_CACHE=$ROOT/.epm-cache" -DEPM_VERBOSE=ON \
            ${{ matrix.cmake-flags }}
          cmake --build build-hello
          "./build-hello/hello$EXE_SUFFIX"

      # (a2) The recipe path with this epm, on every platform: epm compiles
      # HelloGraph's epm.cpp with the compiler that built it (cl's command
      # line on Windows) and runs it, eacp is built into (a)'s cache, and
      # epm_add_recipe builds the recipe as a target of the consumer, whose
      # -configure target runs the whole configure again in it.
      - name: HelloGraph smoke test
        if: inputs.smoke
        run: |
          cmake -S Examples/HelloGraph -B build-hello-graph -G Ninja -DCMAKE_BUILD_TYPE=Release \
            "-DEPM_EXECUTABLE=$ROOT/build/Apps/epm/epm$EXE_SUFFIX" \
            "-DEPM_CACHE=$ROOT/.epm-cache" -DEPM_VERBOSE=ON \
            ${{ matrix.cmake-flags }}
          ls "$ROOT/.epm-cache"/recipe/*/epm-recipe$EXE_SUFFIX
          cmake --build build-hello-graph
          "./build-hello-graph/hello$EXE_SUFFIX"
          [ -f "build-hello-graph/HelloGraphRecipe$EXE_SUFFIX" ]
          cmake --build build-hello-graph --target HelloGraphRecipe-configure

      # The consumer smoke tests below share one cache, $CONSUMER_CACHE: (b)
      # starts it empty, (c) deletes only its tool/ directory and (d) reuses
      # the tool entry (c) built, so each reuses the eacp build of the step
      # before. (c) and (d) run on the `source-smoke` job only: get_epm.cmake
      # never downloads a binary, so a consumer without an installed epm builds
      # the newest release tag from source, Debug and Release.
      #
      # They configure a vendored copy of HelloEacp, not Examples/HelloEacp: a
      # get_epm.cmake inside the epm checkout builds that checkout by default,
      # which would bypass the PATH, release tag and EPM_VERSION paths these
      # steps test. The copy keeps include(../../CMake/get_epm.cmake) working with
      # no epm CMakeLists.txt above CMake/, as in a real consumer.
      - name: Stage a vendored HelloEacp
        if: inputs.smoke
        run: |
          temp="$(cygpath -m "$RUNNER_TEMP" 2>/dev/null || echo "$RUNNER_TEMP")"
          smoke="$temp/smoke"
          rm -rf "$smoke"
          cmake -E copy_directory Examples/HelloEacp "$smoke/Examples/HelloEacp"
          cmake -E copy CMake/get_epm.cmake "$smoke/CMake/get_epm.cmake"
          if [ -e "$smoke/CMakeLists.txt" ]; then
            echo "::error::$smoke/CMakeLists.txt exists; the copy would not look vendored"
            exit 1
          fi
          {
            echo "VENDORED_HELLO=$smoke/Examples/HelloEacp"
            echo "CONSUMER_CACHE=$ROOT/.epm-cache-consumer"
          } >> "$GITHUB_ENV"

      # (b) An epm 0.1.1 installed on PATH (a release archive: bin/ and share/)
      # is preferred when no range is given.
      - name: HelloEacp PATH smoke test
        if: inputs.smoke
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then ext=zip; else ext=tar.gz; fi
          curl -fsSL -o "epm-0.1.1.$ext" \
            "https://github.com/eyalamirmusic/epm/releases/download/v0.1.1/epm-0.1.1-${{ matrix.platform }}.$ext"
          rm -rf .epm-path && mkdir .epm-path
          (cd .epm-path && cmake -E tar xf "../epm-0.1.1.$ext")
          export PATH="$PWD/.epm-path/bin:$PATH"
          epm --version
          rm -rf "$CONSUMER_CACHE"
          cmake -S "$VENDORED_HELLO" -B build-hello-path -G Ninja -DCMAKE_BUILD_TYPE=Release \
            "-DEPM_CACHE=$CONSUMER_CACHE" \
            ${{ matrix.cmake-flags }} 2>&1 | tee configure-path.log
          grep -q 'epm: using epm 0.1.1 from' configure-path.log
          cmake --build build-hello-path
          "./build-hello-path/hello$EXE_SUFFIX"

      # (c) A consumer with nothing set and no epm on PATH: get_epm.cmake lists
      # the release tags and builds the newest into <cache>/tool/v<x.y.z>/.
      - name: HelloEacp release source build smoke test
        if: inputs.smoke && matrix.source-smoke
        run: |
          if command -v epm; then
            echo "::error::an epm is on PATH; this test needs none"
            exit 1
          fi
          rm -rf "$CONSUMER_CACHE/tool"
          cmake -S "$VENDORED_HELLO" -B build-hello-source -G Ninja -DCMAKE_BUILD_TYPE=Release \
            "-DEPM_CACHE=$CONSUMER_CACHE" \
            ${{ matrix.cmake-flags }} 2>&1 | tee configure-source.log
          grep -Eq 'epm: building epm v[0-9.]+ into .*/tool/v[0-9.]+ \(Debug and Release; first time only\)' configure-source.log
          grep -Eq 'epm: epm v[0-9.]+: installing Debug' configure-source.log
          grep -Eq 'epm: epm v[0-9.]+: installing Release' configure-source.log
          grep -Eq 'epm: built epm [0-9.]+ into .*/tool/v[0-9.]+' configure-source.log
          cmake --build build-hello-source
          "./build-hello-source/hello$EXE_SUFFIX"

      # (d) epm 0.1.1 on PATH again, but EPM_VERSION 0.1.2 (>= 0.1.2) rules it
      # out: the release tag (c) built is in range and used from the cache,
      # with nothing built.
      - name: HelloEacp version range smoke test
        if: inputs.smoke && matrix.source-smoke
        run: |
          export PATH="$PWD/.epm-path/bin:$PATH"
          cmake -S "$VENDORED_HELLO" -B build-hello-range -G Ninja -DCMAKE_BUILD_TYPE=Release \
            "-DEPM_CACHE=$CONSUMER_CACHE" -DEPM_VERSION=0.1.2 \
            ${{ matrix.cmake-flags }} 2>&1 | tee configure-range.log
          if grep -q 'epm: using epm 0.1.1 from' configure-range.log; then
            echo "::error::EPM_VERSION 0.1.2 still used the epm 0.1.1 on PATH"
            exit 1
          fi
          if grep -q 'epm: building epm' configure-range.log; then
            echo "::error::EPM_VERSION 0.1.2 built an epm instead of using the cached one"
            exit 1
          fi
          grep -Eq 'epm: using epm [0-9.]+ from .*/tool/v[0-9.]+/bin/epm' configure-range.log
          cmake --build build-hello-range
          "./build-hello-range/hello$EXE_SUFFIX"

      # The Apple smoke tests below share one cache, $APPLE_CACHE, which (e)
      # starts empty and (f) reuses for eacp's source.
      #
      # (e) An Xcode consumer with nothing set: Examples/HelloGraph's
      # get_epm.cmake is inside this checkout, so it builds the checkout into
      # <cache>/tool/local-<hash>/, with Ninja whatever the consumer's
      # generator, then takes eacp prebuilt (Release).
      - name: HelloGraph Xcode smoke test
        if: inputs.smoke && runner.os == 'macOS'
        run: |
          echo "APPLE_CACHE=$ROOT/.epm-cache-apple" >> "$GITHUB_ENV"
          rm -rf "$ROOT/.epm-cache-apple"
          cmake -S Examples/HelloGraph -B build-hello-xcode -G Xcode \
            "-DEPM_CACHE=$ROOT/.epm-cache-apple" 2>&1 | tee configure-xcode.log
          grep -Eq 'epm: building epm from .* into .*/tool/local-[0-9a-f]+ \(Debug and Release; first time only\)' configure-xcode.log
          if ! ls -d "$ROOT/.epm-cache-apple"/tool/local-*/build-ninja; then
            echo "::error::get_epm.cmake did not build epm with Ninja under an Xcode consumer"
            exit 1
          fi
          cmake --build build-hello-xcode --config Release
          ./build-hello-xcode/Release/hello

      # (f) An iOS simulator consumer under Xcode, without a toolchain file:
      # NestedGraph's App, with the sibling Lib from source and eacp prebuilt
      # (every config, as Xcode is multi-config) for the simulator's
      # architectures. The app has to be a simulator binary for each of them,
      # and eacp's cache entry an ios-simulator one.
      - name: NestedGraph iOS simulator smoke test
        if: inputs.smoke && runner.os == 'macOS'
        run: |
          cmake -S Examples/NestedGraph/App -B build-nested-ios -G Xcode \
            -DCMAKE_SYSTEM_NAME=iOS -DCMAKE_OSX_SYSROOT=iphonesimulator \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=15.0 \
            -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGNING_ALLOWED=NO \
            "-DEPM_EXECUTABLE=$ROOT/build/Apps/epm/epm" \
            "-DEPM_CACHE=$APPLE_CACHE" -DEPM_VERBOSE=ON
          cmake --build build-nested-ios --config Release
          app=build-nested-ios/Release-iphonesimulator/app.app/app
          archs="$(lipo -archs "$app")"
          echo "app architectures: $archs"
          for arch in $archs; do
            build_version="$(vtool -arch "$arch" -show-build "$app")"
            echo "$build_version"
            if ! grep -q 'platform IOSSIMULATOR' <<< "$build_version"; then
              echo "::error::app ($arch) is not an iOS simulator binary"
              exit 1
            fi
          done
          if ! ls -d "$APPLE_CACHE"/bin/eacp/ios-simulator-*/; then
            echo "::error::no ios-simulator entry for eacp in $APPLE_CACHE/bin/eacp"
            exit 1
          fi

      # A usable prefix holds the recipe libraries of both configurations
      # (lib/Debug/ and lib/Release/), so the package needs a Debug build of
      # epm beside the Release one in `build`. Ninja is single-config: a second
      # build directory, without the tests.
      - name: Build Debug for the package
        if: inputs.package
        run: |
          cmake -S . -B build-debug -G Ninja -DCMAKE_BUILD_TYPE=Debug -DEPM_ENABLE_TESTS=OFF \
            ${{ matrix.cmake-flags }} ${{ matrix.epm-flags }}
          cmake --build build-debug --parallel

      - name: Package
        if: inputs.package
        run: |
          version="$(sed -n 's/^project(epm VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt)"

          if [[ "$GITHUB_REF" == refs/tags/v* && "${GITHUB_REF_NAME#v}" != "$version" ]]; then
            echo "::error::tag $GITHUB_REF_NAME does not match project(epm VERSION $version)"
            exit 1
          fi

          # Debug and then Release, as get_epm.cmake fills a tool entry:
          # lib/<config>/ of each, and bin/epm the Release one.
          name="epm-$version-${{ matrix.platform }}"
          stage="stage/$name"
          rm -rf "$stage"
          cmake --install build-debug --config Debug --prefix "$stage"
          cmake --install build --config Release --prefix "$stage"
          (cd "$stage" && find . -type f | sort)
          [ "$("$stage/bin/epm$EXE_SUFFIX" --version)" = "$version" ]
          # epm-recipe links eacp-network (IPC::Lock, through PackageLock.h).
          for config in Debug Release; do
            for library in epm-recipe eacp-network; do
              if ! ls "$stage/lib/$config/"*"$library".* > /dev/null; then
                echo "::error::no $library library in $stage/lib/$config"
                exit 1
              fi
            done
          done
          [ -f "$stage/include/epm/Recipe/Recipe.h" ]
          [ -f "$stage/include/eacp/Network/IPC/Lock.h" ]
          [ -f "$stage/share/epm/cmake/epm.cmake" ]
          [ -f "$stage/share/epm/cmake/epm-provider.cmake" ]

          # The install as is at the archive root: unpacked into a prefix, it is
          # an installed epm (bin/epm with share/epm/cmake/epm.cmake beside it).
          mkdir -p dist
          if [ "$RUNNER_OS" = "Windows" ]; then
            (cd "$stage" && cmake -E tar cf "$ROOT/dist/$name.zip" --format=zip bin lib include share)
          else
            (cd "$stage" && cmake -E tar czf "$ROOT/dist/$name.tar.gz" bin lib include share)
          fi
          ls -l dist

      - name: Upload the package
        if: inputs.package
        uses: actions/upload-artifact@v7
        with:
          name: epm-${{ matrix.platform }}
          path: dist/*
          if-no-files-found: error
