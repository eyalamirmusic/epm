name: Build

# Reusable: one job per target, called by ci.yml (tests + HelloEacp smoke) and
# release.yml (tests + packaging). The matrix lives only here.
on:
  workflow_call:
    inputs:
      smoke:
        description: Build and run Examples/HelloEacp with the just-built epm
        type: boolean
        default: false
      package:
        description: Install, archive and upload epm-<version>-<platform>
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    continue-on-error: ${{ matrix.allow-failure == true }}

    strategy:
      fail-fast: false
      matrix:
        # `platform` is the release asset suffix and must match the manifest
        # keys get_epm.cmake looks up (get_epm_host_platform).
        # `cmake-flags` apply to epm and to the HelloEacp smoke build,
        # `epm-flags` to epm only. Linux links with lld: eacp's
        # set_default_target_setting turns on LTO for Release, and GNU ld
        # cannot read clang's bitcode archives without the LLVMgold plugin.
        include:
          - platform: macos-universal
            os: macos-15
            epm-flags: '-DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"'
          - platform: windows-x64
            os: windows-latest
            msvc-arch: x64
            cmake-flags: -DCMAKE_C_COMPILER=clang-cl -DCMAKE_CXX_COMPILER=clang-cl
          - platform: windows-arm64
            os: windows-11-arm
            msvc-arch: arm64
            cmake-flags: -DCMAKE_C_COMPILER=clang-cl -DCMAKE_CXX_COMPILER=clang-cl
          - platform: linux-x64
            os: ubuntu-24.04
            cmake-flags: >-
              -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++
              -DCMAKE_LINKER_TYPE=LLD
          - platform: linux-arm64
            os: ubuntu-24.04-arm
            cmake-flags: >-
              -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++
              -DCMAKE_LINKER_TYPE=LLD

    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v7

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld ninja-build libcurl4-openssl-dev

      - name: Set up the MSVC environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.msvc-arch }}

      # Forward slashes on Windows too, so the paths can go straight into CMake.
      - name: Set up paths
        run: |
          root="$(pwd -W 2>/dev/null || pwd)"
          suffix=""
          if [ "$RUNNER_OS" = "Windows" ]; then suffix=".exe"; fi
          {
            echo "ROOT=$root"
            echo "EXE_SUFFIX=$suffix"
            echo "CPM_SOURCE_CACHE=$root/.cpm-cache"
          } >> "$GITHUB_ENV"

      - name: Show the toolchain
        run: |
          cmake --version
          echo "ninja $(ninja --version)"
          if [ "$RUNNER_OS" = "Windows" ]; then
            where clang-cl && clang-cl --version
          else
            clang++ --version
          fi

      # eacp is fetched at GIT_TAG main, which CPM never refreshes inside an
      # existing source cache, so eacp's current commit is part of the key and a
      # new eacp commit starts a fresh cache rather than restoring a stale one.
      - name: Resolve eacp main
        id: eacp
        run: |
          echo "sha=$(git ls-remote https://github.com/eyalamirmusic/eacp refs/heads/main | cut -f1)" >> "$GITHUB_OUTPUT"

      - name: Cache CPM sources
        uses: actions/cache@v6
        with:
          path: .cpm-cache
          key: cpm-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('CMake/Find*.cmake') }}-eacp-${{ steps.eacp.outputs.sha }}

      - name: Configure
        run: >
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          -DEPM_LOCK_MODE=locked "-DEPM_CACHE=${{ env.ROOT }}/.epm-self-cache"
          ${{ matrix.cmake-flags }} ${{ matrix.epm-flags }}

      - name: Build
        run: cmake --build build --parallel

      - name: Check the binary
        run: |
          "build/Apps/epm/epm$EXE_SUFFIX" --version
          if [ "$RUNNER_OS" = "macOS" ]; then
            archs="$(lipo -archs build/Apps/epm/epm)"
            echo "architectures: $archs"
            [[ "$archs" == *arm64* && "$archs" == *x86_64* ]]
          fi

      - name: Test
        run: ctest --test-dir build --output-on-failure

      # epm built itself in locked mode from epm.lock: every package must still
      # hash to its lock entry (glslang, which eacp asks for on Linux only, is
      # fetched by verify elsewhere), the configure must not have changed one byte of
      # the lock, and the root is printed so the lanes can be compared.
      - name: Verify epm's own lock
        run: |
          git diff --exit-code epm.lock
          "build/Apps/epm/epm$EXE_SUFFIX" lock verify --full --lock epm.lock \
            "--cache=$ROOT/.epm-self-cache"
          echo "root: $("build/Apps/epm/epm$EXE_SUFFIX" lock root --lock epm.lock)"

      # (a) The full consumer path with this epm: get_epm.cmake takes
      # EPM_EXECUTABLE and, finding no module installed beside it, the
      # repository's CMake/epm.cmake. MODE auto, so eacp is fetched and built
      # Debug + Release into a cache inside the workspace.
      - name: HelloEacp smoke test
        if: inputs.smoke
        run: |
          cmake -S Examples/HelloEacp -B build-hello -G Ninja -DCMAKE_BUILD_TYPE=Release \
            "-DEPM_EXECUTABLE=$ROOT/build/Apps/epm/epm$EXE_SUFFIX" \
            "-DEPM_CACHE=$ROOT/.epm-cache" \
            -DEPM_VERBOSE=ON ${{ matrix.cmake-flags }}
          cmake --build build-hello
          "./build-hello/hello$EXE_SUFFIX"
          # A fresh configure against Examples/HelloEacp/epm.lock must take eacp
          # from the binary cache rather than build it again.
          cmake -S Examples/HelloEacp -B build-hello-hit -G Ninja -DCMAKE_BUILD_TYPE=Release \
            "-DEPM_EXECUTABLE=$ROOT/build/Apps/epm/epm$EXE_SUFFIX" \
            "-DEPM_CACHE=$ROOT/.epm-cache" \
            -DEPM_VERBOSE=ON ${{ matrix.cmake-flags }} | tee hello-hit.log
          if grep -q "epm: building eacp" hello-hit.log; then
            echo "the second configure rebuilt eacp instead of hitting the binary cache"
            exit 1
          fi
          cmake --build build-hello-hit
          "./build-hello-hit/hello$EXE_SUFFIX"

      # The consumer smoke tests below share one cache: (b) starts it empty,
      # (c) and (d) delete only its tool/ directory, so each picks its epm from
      # scratch but reuses the eacp build of the step before. (b) and (d) need
      # a release that ships manifest.json and skip until there is one.
      - name: Check for a release manifest
        if: inputs.smoke
        run: |
          code="$(curl -sL -o /dev/null -w '%{http_code}' \
            https://github.com/eyalamirmusic/epm/releases/latest/download/manifest.json)"
          echo "releases/latest/download/manifest.json: HTTP $code"
          case "$code" in
            200) echo "HAVE_MANIFEST=1" >> "$GITHUB_ENV" ;;
            404) echo "::notice::the latest epm release has no manifest.json; skipping the download smoke tests" ;;
            *) exit 1 ;;
          esac
          echo "CONSUMER_CACHE=$ROOT/.epm-cache-consumer" >> "$GITHUB_ENV"

      # (b) A consumer with nothing set and no epm on PATH: get_epm.cmake must
      # download the latest release into the empty cache.
      - name: HelloEacp latest release smoke test
        if: inputs.smoke && env.HAVE_MANIFEST == '1'
        run: |
          if command -v epm; then
            echo "::error::an epm is on PATH; this test needs none"
            exit 1
          fi
          rm -rf "$CONSUMER_CACHE"
          cmake -S Examples/HelloEacp -B build-hello-latest -G Ninja -DCMAKE_BUILD_TYPE=Release \
            "-DEPM_CACHE=$CONSUMER_CACHE" \
            ${{ matrix.cmake-flags }} 2>&1 | tee configure-latest.log
          grep -q 'epm: downloaded epm' configure-latest.log
          cmake --build build-hello-latest
          "./build-hello-latest/hello$EXE_SUFFIX"

      # (c) An epm 0.1.1 installed on PATH is preferred when no range is given.
      - name: HelloEacp PATH smoke test
        if: inputs.smoke
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then ext=zip; else ext=tar.gz; fi
          curl -fsSL -o "epm-0.1.1.$ext" \
            "https://github.com/eyalamirmusic/epm/releases/download/v0.1.1/epm-0.1.1-${{ matrix.platform }}.$ext"
          rm -rf .epm-path && mkdir .epm-path
          (cd .epm-path && cmake -E tar xf "../epm-0.1.1.$ext")
          export PATH="$PWD/.epm-path/bin:$PATH"
          epm --version
          rm -rf "$CONSUMER_CACHE/tool"
          cmake -S Examples/HelloEacp -B build-hello-path -G Ninja -DCMAKE_BUILD_TYPE=Release \
            "-DEPM_CACHE=$CONSUMER_CACHE" \
            ${{ matrix.cmake-flags }} 2>&1 | tee configure-path.log
          grep -q 'using epm 0.1.1 from' configure-path.log
          cmake --build build-hello-path
          "./build-hello-path/hello$EXE_SUFFIX"

      # (d) The same PATH, but EPM_VERSION 0.1.2 (>= 0.1.2) rules it out: the
      # latest release is downloaded instead.
      - name: HelloEacp version range smoke test
        if: inputs.smoke && env.HAVE_MANIFEST == '1'
        run: |
          export PATH="$PWD/.epm-path/bin:$PATH"
          rm -rf "$CONSUMER_CACHE/tool"
          cmake -S Examples/HelloEacp -B build-hello-range -G Ninja -DCMAKE_BUILD_TYPE=Release \
            "-DEPM_CACHE=$CONSUMER_CACHE" -DEPM_VERSION=0.1.2 \
            ${{ matrix.cmake-flags }} 2>&1 | tee configure-range.log
          if grep -q 'using epm 0.1.1 from' configure-range.log; then
            echo "::error::EPM_VERSION 0.1.2 still used the epm 0.1.1 on PATH"
            exit 1
          fi
          grep -q 'epm: downloaded epm' configure-range.log
          cmake --build build-hello-range
          "./build-hello-range/hello$EXE_SUFFIX"

      - name: Package
        if: inputs.package
        run: |
          version="$(sed -n 's/^project(epm VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt)"

          if [[ "$GITHUB_REF" == refs/tags/v* && "${GITHUB_REF_NAME#v}" != "$version" ]]; then
            echo "::error::tag $GITHUB_REF_NAME does not match project(epm VERSION $version)"
            exit 1
          fi

          name="epm-$version-${{ matrix.platform }}"
          stage="stage/$name"
          cmake --install build --prefix "$stage"
          (cd "$stage" && find . -type f | sort)
          [ "$("$stage/bin/epm$EXE_SUFFIX" --version)" = "$version" ]

          # bin/ and share/ at the archive root: unpacked as is into
          # <cache>/tool/<ref>/ by the bootstrap.
          mkdir -p dist
          if [ "$RUNNER_OS" = "Windows" ]; then
            (cd "$stage" && cmake -E tar cf "$ROOT/dist/$name.zip" --format=zip bin share)
          else
            (cd "$stage" && cmake -E tar czf "$ROOT/dist/$name.tar.gz" bin share)
          fi
          ls -l dist

      - name: Upload the package
        if: inputs.package
        uses: actions/upload-artifact@v7
        with:
          name: epm-${{ matrix.platform }}
          path: dist/*
          if-no-files-found: error
